; Minitel link test for a Seeed XIAO nRF52840 (no MeshCore).
; Minitel on Serial1: D6 = TX -> interface -> DIN 1, D7 = RX <- DIN 3.
; Same core, board file and linker script as the MeshCore Xiao_nrf52 env.

[env:xiao_minitel_test]
platform = nordicnrf52
framework = arduino
board = seeed-xiao-afruitnrf52-nrf52840
board_build.ldscript = boards/nrf52840_s140_v7.ld
board_build.variants_dir = variants
board_build.variant = xiao
platform_packages =
  framework-arduinoadafruitnrf52 @ https://github.com/meshcore-dev/Adafruit_nRF52_Arduino#d541301665b40959682252911e57b11df3ee651a
  platformio/toolchain-gccarmnoneeabi@^1.140201.0
build_flags =
  -I sd_api/include
  -I sd_api/include/nrf52
monitor_speed = 115200
